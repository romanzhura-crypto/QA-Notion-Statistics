# GitHub alternative to GitLab CI: Backend snapshot → Frontend JSON → GitHub Pages.
# Secret: Settings → Secrets and variables → Actions → NOTION_TOKEN
# Never commit config/notion.json. Do not log the secret.
# Pages: Settings → Pages → Source = GitHub Actions.
# Board #249: cancel-in-progress=true so a stuck run never blocks the queue
# (2026-10-05 incident: queued run held the group 7.5h, cascading cancels).
# Widget button "Обновить данные" dispatches this workflow as job "Sync Notion"
# via the public QA CORS proxy (token stays on QA, never in the iframe).

name: Sync Notion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source:
        description: Who triggered Sync Notion (widget / schedule / manual)
        required: false
        default: manual
        type: string
      target:
        # Board #263 (multi-base): which widget base triggered the button.
        # Informational — every run refreshes BOTH bases into one Pages artifact
        # (root = sprint, 1c/ = 1C), so in-flight reuse stays correct for any target.
        description: Widget base that requested sync (sprint / 1c / both)
        required: false
        default: both
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync-notion-pages
  # Board #258 (revises #250): NEVER cancel an in-flight Pages deploy.
  # A deploy-pages run cancelled mid-deploy wedges the Pages serving layer:
  # later deployments report success but the served content freezes
  # (incident 2026-10-07: release-data.json stuck at 04:12Z for 6+ hours).
  # Queued runs still supersede older *pending* runs; only in-progress ones
  # are allowed to finish.
  cancel-in-progress: false

env:
  ROOT: ${{ github.workspace }}
  WIDGETS_JSON: ${{ github.workspace }}/frontend/release-data.json
  QA_WWW: ""
  QA_WWW_JSON: ${{ github.workspace }}/frontend/release-data.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: static guards
        run: |
          python3 -m py_compile backend/release-widget-sync.py
          python3 -m py_compile backend/log-statistics-sync.py
          python3 -m py_compile backend/run-state-store.py
          python3 backend/log-statistics-sync.py selftest
          python3 backend/run-state-store.py selftest
          python3 backend/release-widget-sync.py dry
          python3 backend/quality-gate.py selftest
          python3 backend/test_widget_profiles.py
          python3 tests/test_a14_parallel.py
          test ! -f config/notion.json
          test ! -f config/gitlab.env
          test ! -f config/github.env
          python3 -c "from pathlib import Path; t=Path('frontend/release-charts.html').read_text()+Path('frontend/status-dwell.html').read_text(); assert 'widgets/sync' not in t; assert 'GITHUB_TOKEN' not in t; assert 'ntn_' not in t"
          if grep -RInE 'secret_[A-Za-z0-9]{10,}|ntn_[A-Za-z0-9]{10,}' frontend backend; then exit 1; fi
          # Notion API 2026-03-11 contract: request bodies must use in_trash, never archived (see board #161)
          if grep -RInE "[\"']archived[\"'][[:space:]]*:" backend; then echo 'DEPRECATED: "archived" request-body field — use in_trash' >&2; exit 1; fi

  snapshot:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Board #330: expected live-content values (generated_at/task_count) are
    # exported here so the deploy job can verify what GitHub Pages actually
    # serves after the deploy.
    outputs:
      expected_sprint_generated_at: ${{ steps.expected.outputs.sprint_generated_at }}
      expected_sprint_task_count: ${{ steps.expected.outputs.sprint_task_count }}
      expected_1c_generated_at: ${{ steps.expected.outputs.1c_generated_at }}
      expected_1c_task_count: ${{ steps.expected.outputs.1c_task_count }}
    environment: github-pages
    # Board #206 (A28): contents:write for run-state-store.py push — the durable
    # run-state branch must receive the collector metrics (runs_*, *_total,
    # last_ok_at) written here, or ephemeral runners lose the counters.
    permissions:
      contents: write  # run-state-store.py push (durable run-state branch)
      pages: write
      id-token: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: require secret
        run: test -n "$NOTION_TOKEN"
      # Board #273 (fix #272): webhook run-state from the durable git branch
      # (backend/run-state-store.py), NOT actions/cache — cache keys are
      # immutable and restore-keys matched random stale generations, flapping
      # quality.webhook in the published JSON (incident 2026-10-13).
      # Board #263: both profiles — sprint (legacy name) + 1c (suffixed state file).
      - name: pull webhook run-state (durable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/run-state-store.py pull
      # Board #202 (A17): resume journals from actions/cache — a run killed on
      # an ephemeral runner resumes without redoing finished items (collector)
      # or re-fetching Notion (snapshot fetch cache). See
      # docs/release-data-contract.md, section A17.
      - name: restore resume journals (A17)
        uses: actions/cache/restore@v4
        with:
          path: |
            config/log-statistics-journal.jsonl
            config/release-widget-journal.jsonl
            config/log-statistics-journal-1c.jsonl
            config/release-widget-journal-1c.jsonl
          key: resume-journal-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            resume-journal-
      - name: snapshot JSON for frontend (sprint)
        run: python3 backend/release-widget-sync.py snapshot
      - name: upsert LOG STATISTICS (sprint)
        env:
          LOG_STATISTICS_DSID: 3dee17b6-8482-80a3-9fc4-000bafe19b46
          # Incremental default: CREATE missing, PATCH collector seed/status change/Done at.
          # First run after collector ships seeds Collected Status + Status since (one full pass).
          # Force full with LOG_STATS_FULL=1.
          LOG_STATS_FULL: "0"
          LOG_STATS_REWRITE_TITLE: "0"
        run: python3 backend/log-statistics-sync.py
      # Board #202 (A17): persist resume journals even after a failed step — the
      # next run on a fresh runner resumes instead of redoing work (unique key
      # per run, last-write-wins via the restore-keys prefix).
      - name: persist resume journals (A17)
        if: ${{ always() }}
        run: mkdir -p config && touch config/log-statistics-journal.jsonl config/release-widget-journal.jsonl config/log-statistics-journal-1c.jsonl config/release-widget-journal-1c.jsonl
      - name: save resume journals (A17)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            config/log-statistics-journal.jsonl
            config/release-widget-journal.jsonl
            config/log-statistics-journal-1c.jsonl
            config/release-widget-journal-1c.jsonl
          key: resume-journal-${{ github.run_id }}-${{ github.run_attempt }}
      - name: re-enrich JSON from LOG collector (sprint)
        run: python3 backend/release-widget-sync.py enrich
      # ---- Board #263 multi-base: profile 1c → artifact subdir 1c/ ----
      - name: snapshot JSON for frontend (1c)
        env:
          WIDGET_PROFILE: "1c"
          WIDGETS_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          QA_WWW_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
        run: python3 backend/release-widget-sync.py snapshot
      - name: upsert LOG STATISTICS (1c)
        env:
          WIDGET_PROFILE: "1c"
          WIDGETS_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          QA_WWW_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          LOG_STATS_FULL: "0"
          LOG_STATS_REWRITE_TITLE: "0"
        run: python3 backend/log-statistics-sync.py
      - name: re-enrich JSON from LOG collector (1c)
        env:
          WIDGET_PROFILE: "1c"
          WIDGETS_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          QA_WWW_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
        run: python3 backend/release-widget-sync.py enrich
      - name: stage static HTML+JSON
        run: QA_WWW="" bash backend/publish-release-widgets.sh
      - name: assert no token in JSON
        run: |
          python3 -c "import json,pathlib; p=pathlib.Path('frontend/public/release-data.json'); d=json.loads(p.read_text()); assert 'token' not in d and d.get('ok') is True"
          python3 -c "import json,pathlib; p=pathlib.Path('frontend/public/1c/release-data.json'); d=json.loads(p.read_text()); assert 'token' not in d and d.get('ok') is True; print('1c', d.get('data_source_id'), d.get('task_count'), d.get('generated_at'))"
      # A27 quality gate (board #183): block a bad snapshot BEFORE Pages deploy.
      # Hard: delta %, segments_negative/absurd, tasks_without_history, gap_hours (N1),
      # drift_days (N2), a19_conflicts. WARN-only: truncated_titles etc.
      - name: quality gate (A27)
        run: |
          python3 backend/quality-gate.py frontend/public/release-data.json
          python3 backend/quality-gate.py frontend/public/1c/release-data.json
      # Board #206 (A28) + #273: persist the run-state to the durable branch
      # (always — even after a failed run: error counters and the aged success
      # clock are part of the metrics). Covers both profiles' collector
      # run-state written by the upsert steps above plus the webhook run-state
      # pulled at job start. Winner-merge MAX, best-effort metrics.
      - name: push run-state (durable, A28)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/run-state-store.py push
      # Board #330: read expected live values (generated_at/task_count) from
      # the staged JSON BEFORE upload — the deploy job compares these against
      # the JSON GitHub Pages actually serves.
      - name: record expected live values (board #330)
        id: expected
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as fh:
              for tag, p in (('sprint', 'frontend/public/release-data.json'),
                             ('1c', 'frontend/public/1c/release-data.json')):
                  d = json.loads(Path(p).read_text())
                  fh.write(f"{tag}_generated_at={d.get('generated_at')}\n")
                  fh.write(f"{tag}_task_count={d.get('task_count')}\n")
          PY
      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public

  deploy:
    needs: snapshot
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Board #330: post-deploy verification of live Pages content. PAGES_VERIFY_FAIL
      # line format is a contract with external QA monitoring — do not change.
      - name: verify-pages-live
        env:
          EXPECTED_SPRINT_GENERATED_AT: ${{ needs.snapshot.outputs.expected_sprint_generated_at }}
          EXPECTED_SPRINT_TASK_COUNT: ${{ needs.snapshot.outputs.expected_sprint_task_count }}
          EXPECTED_1C_GENERATED_AT: ${{ needs.snapshot.outputs.expected_1c_generated_at }}
          EXPECTED_1C_TASK_COUNT: ${{ needs.snapshot.outputs.expected_1c_task_count }}
          VERIFY_CB: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          base = 'https://romanzhura-crypto.github.io/QA-Notion-Statistics'
          cb = os.environ['VERIFY_CB']
          targets = [
              ('sprint', f'{base}/release-data.json?cb={cb}',
               os.environ['EXPECTED_SPRINT_GENERATED_AT'], os.environ['EXPECTED_SPRINT_TASK_COUNT']),
              ('1c', f'{base}/1c/release-data.json?cb={cb}',
               os.environ['EXPECTED_1C_GENERATED_AT'], os.environ['EXPECTED_1C_TASK_COUNT']),
          ]

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode())

          def fail(live_sprint, expected_sprint, live_1c, expected_1c):
              # Contract with external QA monitoring — exact line format:
              print(f'PAGES_VERIFY_FAIL live_sprint={live_sprint} expected_sprint={expected_sprint} '
                    f'live_1c={live_1c} expected_1c={expected_1c}')
              sys.exit(1)

          for attempt in range(1, 7):
              live = {}
              try:
                  for tag, url, _, _ in targets:
                      d = fetch(url)
                      live[tag] = (str(d.get('generated_at')), str(d.get('task_count')))
              except Exception as e:
                  print(f'attempt {attempt}: fetch error: {e}')
                  if attempt < 6:
                      time.sleep(30)
                      continue
                  fail('fetch-error', targets[0][2], 'fetch-error', targets[1][2])

              ok = True
              for tag, _, exp_gen, exp_count in targets:
                  lg, lc = live[tag]
                  if lg != exp_gen or lc != exp_count:
                      ok = False
              if ok:
                  print(f'PAGES_VERIFY_PASS sprint_generated_at={live["sprint"][0]} '
                        f'1c_generated_at={live["1c"][0]} task_counts={live["sprint"][1]}/{live["1c"][1]}')
                  sys.exit(0)
              print(f'attempt {attempt}: sprint live={live["sprint"]} expected=({targets[0][2]}, {targets[0][3]}) '
                    f'1c live={live["1c"]} expected=({targets[1][2]}, {targets[1][3]})')
              if attempt < 6:
                  time.sleep(30)

          fail(live['sprint'][0], targets[0][2], live['1c'][0], targets[1][2])
          PY

  # Push to main: publish the committed frontend JSON/HTML without calling Notion.
  # Needed so a local Sprint snapshot can go live even if Actions NOTION_TOKEN
  # is still the old integration or schedule has not fired.
  publish_committed:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    # Board #330: expected live-content values for the post-deploy verify.
    outputs:
      expected_sprint_generated_at: ${{ steps.expected.outputs.sprint_generated_at }}
      expected_sprint_task_count: ${{ steps.expected.outputs.sprint_task_count }}
      expected_1c_generated_at: ${{ steps.expected.outputs.1c_generated_at }}
      expected_1c_task_count: ${{ steps.expected.outputs.1c_task_count }}
    steps:
      - uses: actions/checkout@v4
      - name: stage committed HTML+JSON
        run: |
          mkdir -p frontend/public
          cp -f frontend/release-charts.html frontend/status-dwell.html frontend/release-data.json frontend/public/
          python3 -c "import json,pathlib; p=pathlib.Path('frontend/public/release-data.json'); d=json.loads(p.read_text()); assert 'token' not in d and d.get('ok') is True; print(d.get('data_source_id'), d.get('task_count'), d.get('generated_at'))"
          if [ -f frontend/1c/release-data.json ]; then
            mkdir -p frontend/public/1c
            cp -f frontend/1c/release-charts.html frontend/1c/status-dwell.html frontend/1c/release-data.json frontend/public/1c/
            python3 -c "import json,pathlib; p=pathlib.Path('frontend/public/1c/release-data.json'); d=json.loads(p.read_text()); assert 'token' not in d and d.get('ok') is True; print('1c', d.get('data_source_id'), d.get('task_count'), d.get('generated_at'))"
          fi
      # Board #330: read expected live values (generated_at/task_count) from the
      # staged JSON BEFORE upload — the deploy job compares these against the
      # JSON GitHub Pages actually serves.
      - name: record expected live values (board #330)
        id: expected
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as fh:
              for tag, p in (('sprint', 'frontend/public/release-data.json'),
                             ('1c', 'frontend/public/1c/release-data.json')):
                  if not Path(p).is_file():
                      fh.write(f"{tag}_generated_at=\n")
                      fh.write(f"{tag}_task_count=\n")
                      continue
                  d = json.loads(Path(p).read_text())
                  fh.write(f"{tag}_generated_at={d.get('generated_at')}\n")
                  fh.write(f"{tag}_task_count={d.get('task_count')}\n")
          PY
      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public

  deploy_committed:
    needs: publish_committed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Board #330: post-deploy verification of live Pages content. PAGES_VERIFY_FAIL
      # line format is a contract with external QA monitoring — do not change.
      - name: verify-pages-live
        env:
          EXPECTED_SPRINT_GENERATED_AT: ${{ needs.publish_committed.outputs.expected_sprint_generated_at }}
          EXPECTED_SPRINT_TASK_COUNT: ${{ needs.publish_committed.outputs.expected_sprint_task_count }}
          EXPECTED_1C_GENERATED_AT: ${{ needs.publish_committed.outputs.expected_1c_generated_at }}
          EXPECTED_1C_TASK_COUNT: ${{ needs.publish_committed.outputs.expected_1c_task_count }}
          VERIFY_CB: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          base = 'https://romanzhura-crypto.github.io/QA-Notion-Statistics'
          cb = os.environ['VERIFY_CB']
          targets = [
              ('sprint', f'{base}/release-data.json?cb={cb}',
               os.environ['EXPECTED_SPRINT_GENERATED_AT'], os.environ['EXPECTED_SPRINT_TASK_COUNT']),
              ('1c', f'{base}/1c/release-data.json?cb={cb}',
               os.environ['EXPECTED_1C_GENERATED_AT'], os.environ['EXPECTED_1C_TASK_COUNT']),
          ]

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode())

          def fail(live_sprint, expected_sprint, live_1c, expected_1c):
              # Contract with external QA monitoring — exact line format:
              print(f'PAGES_VERIFY_FAIL live_sprint={live_sprint} expected_sprint={expected_sprint} '
                    f'live_1c={live_1c} expected_1c={expected_1c}')
              sys.exit(1)

          for attempt in range(1, 7):
              live = {}
              try:
                  for tag, url, _, _ in targets:
                      d = fetch(url)
                      live[tag] = (str(d.get('generated_at')), str(d.get('task_count')))
              except Exception as e:
                  print(f'attempt {attempt}: fetch error: {e}')
                  if attempt < 6:
                      time.sleep(30)
                      continue
                  fail('fetch-error', targets[0][2], 'fetch-error', targets[1][2])

              ok = True
              for tag, _, exp_gen, exp_count in targets:
                  lg, lc = live[tag]
                  if lg != exp_gen or lc != exp_count:
                      ok = False
              if ok:
                  print(f'PAGES_VERIFY_PASS sprint_generated_at={live["sprint"][0]} '
                        f'1c_generated_at={live["1c"][0]} task_counts={live["sprint"][1]}/{live["1c"][1]}')
                  sys.exit(0)
              print(f'attempt {attempt}: sprint live={live["sprint"]} expected=({targets[0][2]}, {targets[0][3]}) '
                    f'1c live={live["1c"]} expected=({targets[1][2]}, {targets[1][3]})')
              if attempt < 6:
                  time.sleep(30)

          fail(live['sprint'][0], targets[0][2], live['1c'][0], targets[1][2])
          PY
