# Board #171 (architecture B): Notion status webhook → exact status segments.
# Pipeline: Notion Webhooks → Cloudflare Worker (cloudflare/status-webhook-worker,
# HMAC + repository_dispatch "notion-webhook") → this workflow →
# backend/status-webhook-event.py writes LOG STATISTICS "Segments" with the exact
# event timestamp. Idempotent and order-tolerant; log-statistics-sync.py remains
# the reconciliation fallback (job "Sync Notion").
# Board #174 (variant A): after the segments are applied, job "refresh_pages"
# rebuilds release-data.json (snapshot + enrich) and deploys GitHub Pages, so the
# widget reflects the new status within seconds — no waiting for the schedule.
# Secret: NOTION_TOKEN (same as Sync Notion). Never log the secret.

name: Status Webhook

on:
  repository_dispatch:
    types: [notion-webhook]

permissions:
  contents: read

concurrency:
  group: status-webhook-${{ github.event.client_payload.entity_id || 'none' }}
  cancel-in-progress: false

env:
  LOG_STATISTICS_DSID: 3dee17b6-8482-80a3-9fc4-000bafe19b46

jobs:
  # Fast path: write the exact status segment. Never waits on Pages deploys.
  apply:
    runs-on: ubuntu-latest
    # Board #265: ROOT must point at the CI workspace so status-webhook-event.py
    # writes run-state under config/ where the durable store (board #273) can
    # find it.
    permissions:
      contents: write  # run-state-store.py push (durable run-state branch)
    env:
      ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Board #273 (fix #272): run-state lives in the durable git branch
      # (backend/run-state-store.py, winner-merge + optimistic concurrency),
      # NOT actions/cache — immutable cache keys + restore-keys prefix matched
      # random stale generations, so quality.webhook flapped between fresh and
      # 4-day-old values (incident 2026-10-13, board #272).
      # Board #263: sprint (legacy name) + 1c (suffixed) run-states.
      - name: pull webhook run-state (durable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/run-state-store.py pull
      - name: offline selftest
        run: |
          python3 -m py_compile backend/status-webhook-event.py backend/log-statistics-sync.py backend/run-state-store.py
          python3 backend/status-webhook-event.py selftest
          python3 backend/run-state-store.py selftest
      - name: require secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: test -n "$NOTION_TOKEN"
      - name: apply status event to LOG STATISTICS
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: python3 backend/status-webhook-event.py
      # Board #263 (multi-base): the same event is offered to the 1c handler too.
      # The target guard inside skips anything not addressed to 1c (and the sprint
      # run above already skipped 1c-tagged events) — exactly one base applies it.
      - name: apply status event to LOG STATISTICS (1c)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EVENT_JSON: ${{ toJson(github.event.client_payload) }}
          WIDGET_PROFILE: "1c"
          LOG_STATISTICS_DSID: c98e17b6-8482-820e-9f34-072fdef5db94
        run: python3 backend/status-webhook-event.py
      # Board #273: persist the run-state to the durable branch (always — even
      # after a failed apply: error counters are part of the metrics). The
      # store merges monotonic (clocks max, counters max) and retries on
      # concurrent-writer conflicts; metrics stay best-effort.
      - name: push webhook run-state (durable)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/run-state-store.py push

  # Variant A (board #174): event-driven widget refresh. STRICTLY after "apply"
  # so the snapshot already sees the just-written segment. Mirrors job "snapshot"
  # of release-widgets.yml MINUS the "upsert LOG STATISTICS" step (the segments
  # are already written by status-webhook-event.py — never write them twice).
  # Concurrency group "sync-notion-pages" = same group as release-widgets.yml:
  # two Pages deploys (webhook / schedule / button) can never race each other.
  # Previously pending runs of the group are superseded by newer ones — safe,
  # because snapshot always reads the full current Notion+LOG state.
  refresh_pages:
    needs: apply
    # Board #229: synthetic delivery ping is not a business event — the
    # snapshot is unchanged, never burn a Pages deploy on it.
    if: github.event.client_payload.type != 'ping'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: sync-notion-pages
      cancel-in-progress: false
    env:
      ROOT: ${{ github.workspace }}
      WIDGETS_JSON: ${{ github.workspace }}/frontend/release-data.json
      QA_WWW: ""
      QA_WWW_JSON: ${{ github.workspace }}/frontend/release-data.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: require secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: test -n "$NOTION_TOKEN"
      # Board #273: read the durable webhook run-state so the snapshot's
      # quality.webhook carries real N1 gap/event metrics (same source the
      # apply job merges into).
      - name: pull webhook run-state (durable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/run-state-store.py pull
      - name: snapshot JSON for frontend
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 backend/release-widget-sync.py snapshot
      - name: re-enrich JSON from LOG collector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 backend/release-widget-sync.py enrich
      # Board #263 (multi-base): refresh the 1c artifact too — one Pages deploy
      # serves both bases (root = sprint, 1c/ = 1C), so a single event refresh
      # must never leave one of them stale in the artifact.
      - name: snapshot JSON for frontend (1c)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WIDGET_PROFILE: "1c"
          WIDGETS_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          QA_WWW_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
        run: python3 backend/release-widget-sync.py snapshot
      - name: re-enrich JSON from LOG collector (1c)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WIDGET_PROFILE: "1c"
          WIDGETS_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
          QA_WWW_JSON: ${{ github.workspace }}/frontend/1c/release-data.json
        run: python3 backend/release-widget-sync.py enrich
      - name: stage static HTML+JSON
        run: QA_WWW="" bash backend/publish-release-widgets.sh
      - name: assert no token in JSON
        run: python3 -c "import json,pathlib; p=pathlib.Path('frontend/public/release-data.json'); d=json.loads(p.read_text()); assert 'token' not in d and d.get('ok') is True"
      # Board #330: read expected live values (generated_at/task_count) from the
      # staged JSON BEFORE upload — the verify step after the deploy compares
      # these against the JSON GitHub Pages actually serves.
      - name: record expected live values (board #330)
        id: expected
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as fh:
              for key, p in (('sprint', 'frontend/public/release-data.json'),
                             ('onec', 'frontend/public/1c/release-data.json')):
                  d = json.loads(Path(p).read_text())
                  fh.write(f"{key}_generated_at={d.get('generated_at')}\n")
                  fh.write(f"{key}_task_count={d.get('task_count')}\n")
          PY
      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Board #330: post-deploy verification of live Pages content. PAGES_VERIFY_FAIL
      # line format is a contract with external QA monitoring — do not change.
      - name: verify-pages-live
        env:
          EXPECTED_SPRINT_GENERATED_AT: ${{ steps.expected.outputs.sprint_generated_at }}
          EXPECTED_SPRINT_TASK_COUNT: ${{ steps.expected.outputs.sprint_task_count }}
          EXPECTED_1C_GENERATED_AT: ${{ steps.expected.outputs.onec_generated_at }}
          EXPECTED_1C_TASK_COUNT: ${{ steps.expected.outputs.onec_task_count }}
          VERIFY_CB: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          base = 'https://romanzhura-crypto.github.io/QA-Notion-Statistics'
          cb = os.environ['VERIFY_CB']
          targets = [
              ('sprint', f'{base}/release-data.json?cb={cb}',
               os.environ['EXPECTED_SPRINT_GENERATED_AT'], os.environ['EXPECTED_SPRINT_TASK_COUNT']),
              ('1c', f'{base}/1c/release-data.json?cb={cb}',
               os.environ['EXPECTED_1C_GENERATED_AT'], os.environ['EXPECTED_1C_TASK_COUNT']),
          ]

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read().decode())

          def fail(live_sprint, expected_sprint, live_1c, expected_1c):
              # Contract with external QA monitoring — exact line format:
              print(f'PAGES_VERIFY_FAIL live_sprint={live_sprint} expected_sprint={expected_sprint} '
                    f'live_1c={live_1c} expected_1c={expected_1c}')
              sys.exit(1)

          for attempt in range(1, 7):
              live = {}
              try:
                  for tag, url, _, _ in targets:
                      d = fetch(url)
                      live[tag] = (str(d.get('generated_at')), str(d.get('task_count')))
              except Exception as e:
                  print(f'attempt {attempt}: fetch error: {e}')
                  if attempt < 6:
                      time.sleep(30)
                      continue
                  fail('fetch-error', targets[0][2], 'fetch-error', targets[1][2])

              ok = True
              for tag, _, exp_gen, exp_count in targets:
                  lg, lc = live[tag]
                  if lg != exp_gen or lc != exp_count:
                      ok = False
              if ok:
                  print(f'PAGES_VERIFY_PASS sprint_generated_at={live["sprint"][0]} '
                        f'1c_generated_at={live["1c"][0]} task_counts={live["sprint"][1]}/{live["1c"][1]}')
                  sys.exit(0)
              print(f'attempt {attempt}: sprint live={live["sprint"]} expected=({targets[0][2]}, {targets[0][3]}) '
                    f'1c live={live["1c"]} expected=({targets[1][2]}, {targets[1][3]})')
              if attempt < 6:
                  time.sleep(30)

          fail(live['sprint'][0], targets[0][2], live['1c'][0], targets[1][2])
          PY
